version: 2
updates:
  # npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # minor / patch はまとめて 1 本の PR にする (PR 洪水を防ぐ)
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # サプライチェーン攻撃対策: 公開直後のバージョンは取り込まない。
    # 過去の乗っ取り事例 (chalk/debug worm 2025-09, eslint-config-prettier 2025-07,
    # ua-parser-js 2021) は、いずれも数時間〜数日で検出・yank されている。
    # security update は cooldown を無視して即座に来るので、脆弱性の修正は遅れない。
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

  # GitHub Actions (workflow の uses: を SHA ごと更新してくれる)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # npm と同じ理由で cooldown を置く。Actions も乗っ取り事例がある
    # (tj-actions/changed-files 2025-03)。
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
