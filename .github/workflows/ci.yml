name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions は可変タグではなく commit SHA で固定する。
      # タグはメンテナ側で付け替えられるため、乗っ取られた瞬間に全リポジトリへ
      # 悪意あるコードが流れ込む (tj-actions/changed-files 2025-03)。
      # 更新は Dependabot の github-actions ecosystem が SHA ごと書き換えてくれる。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 除外中の既知案件は scripts/audit.mjs に理由と期限つきで書いてある。
      # 期限を過ぎると除外していても失敗する。
      - run: node scripts/audit.mjs
