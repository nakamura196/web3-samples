[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zkshor"
version = "0.1.0"
description = "ゼロ知識証明を実装し、Shor のアルゴリズムで破るまでの教材"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
zkshor = "zkshor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
